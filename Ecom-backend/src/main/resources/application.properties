# =====================================
# Application
# =====================================
spring.application.name=sb-ecommerce

# =====================================
# Database Configuration (MySQL with env overrides)
# =====================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ecommerce}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root123}

# =====================================
# JPA / Hibernate
# =====================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =====================================
# JWT Configuration
# =====================================
spring.app.jwtSecret=${JWT_SECRET:YXRzdG9uZWJlZ2FuZHJld2ZhbW91c3NvbGRpZXJjbGltYmNhc2VtaWNlZmxpZ2h0bG8=}
spring.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}
spring.ecom.app.jwtCookie=${JWT_COOKIE_NAME:sbecomcookie}

# =====================================
# Project Properties & File Upload
# =====================================
project.image=images/
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# =====================================
# Frontend & CORS Configuration
# =====================================
frontend.url=${FRONTEND_URL:http://localhost:5173}

# =====================================
# OpenAPI / Swagger Documentation
# =====================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha