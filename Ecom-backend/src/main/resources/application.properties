# =====================================
# Application
# =====================================
spring.application.name=angadi-ecommerce

# =====================================
# Database Configuration (MySQL with env overrides)
# =====================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ecommerce}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# =====================================
# JPA / Hibernate
# =====================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =====================================
# Flyway Database Migration
# =====================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# =====================================
# JWT Configuration
# =====================================
spring.app.jwtSecret=${JWT_SECRET:}
spring.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}
spring.ecom.app.jwtCookie=${JWT_COOKIE_NAME:sbecomcookie}

# =====================================
# Development Seed Data Configuration
# =====================================
app.seed.enabled=${APP_SEED_ENABLED:true}
app.seed.admin.password=${SEED_ADMIN_PASSWORD:admin123}
app.seed.seller.password=${SEED_SELLER_PASSWORD:seller123}
app.seed.user.password=${SEED_USER_PASSWORD:user123}

# =====================================
# Project Properties & File Upload
# =====================================
project.image=images/
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# =====================================
# Frontend & CORS Configuration
# =====================================
frontend.url=${FRONTEND_URL:http://localhost:5173}

# =====================================
# OpenAPI / Swagger Documentation
# =====================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha